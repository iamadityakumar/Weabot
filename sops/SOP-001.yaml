id: SOP-001
title: Severe Precipitation and Surface Flooding Hazard
intent: "Severe precipitation, torrential rain, monsoons, and flash flooding affecting all outdoor activities and travel."
category: general
severity: high
override: true
applies_to:
  - all
  - outdoor
  - commute
  - travel
  - cycling
  - bike
  - running
  - walk
  - picnic
  - sports
conditions:
  - type: compound
    combinator: OR
    clauses:
      - field: precipitation
        op: ">="
        value: 15.0
      - type: compound
        combinator: AND
        clauses:
          - field: precipitation_probability
            op: ">="
            value: 70
          - field: rain
            op: ">="
            value: 10.0
advice: >
  High-intensity precipitation conditions (precipitation >= 15 mm, or >= 10 mm rainfall with high probability >= 70%) indicate rapid surface water accumulation, reduced visibility, and localized flooding hazards.
  All non-essential outdoor travel and activities are unsafe and should be postponed until conditions clear.

