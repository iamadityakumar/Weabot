id: SOP-012
title: Marginal or Unsettled Conditions for Outdoor Gatherings
category: general_leisure
severity: moderate
applies_to:
  - picnic
  - park
  - barbecue
  - bbq
  - gathering
  - outdoor party
  - festival
conditions:
  - type: fuzzy
    description: >
      Marginal or unsettled outdoor conditions where gatherings can proceed but require weather contingency plans.
      Evaluated positively when there are gusty breezes (25 to 38 km/h), borderline rain probability (30% to 60%), or marginal ambient temperatures (14°C to 17°C or 27°C to 31°C).
    criteria:
      elevated_wind_range: [25.0, 38.0]
      borderline_rain_prob_range: [30, 60]
advice: >
  Weather conditions for an outdoor gathering or picnic are marginal and unsettled.
  Elevated breezes or a borderline chance of precipitation may disrupt open-air setups, paper goods, or portable awnings.
  You may proceed, but ensure a designated covered pavilion or indoor fallback area is immediately accessible and keep light waterproof jackets on hand.
