id: SOP-008
title: High UV Radiation Exposure Hazard for Children and Sensitive Skin
intent: "High to extreme midday UV radiation exposure and sunburn risk for toddlers, children, and infants at playgrounds and parks."
category: vulnerable_groups
severity: high
applies_to:
  - child
  - children
  - kid
  - toddler
  - infant
  - baby
  - playground
  - park
  - swimming
  - pool
  - outdoor
conditions:
  - type: threshold
    field: uv_index
    op: ">="
    value: 8.0
advice: >
  Very high UV radiation (UV Index >= 8.0) delivers intense solar ultraviolet radiation requiring comprehensive sun protection per World Health Organization (WHO) and Cancer Council standards.
  Strongly advise avoiding direct unshaded sun exposure between 10:00 AM and 4:00 PM during peak solar elevation.
  If outdoor exposure cannot be avoided, apply broad-spectrum SPF 50+ sunscreen generously 20 minutes before exposure, reapply at least every 2 hours (or immediately after swimming or heavy sweating), wear UPF 50+ protective clothing and broad-brimmed hats, and remain under dense shade.
