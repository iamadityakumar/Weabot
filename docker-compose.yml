services:
  weabot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weabot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./sessions:/app/sessions
      - ./sops:/app/sops
      - ./.env:/app/.env
    env_file:
      - .env
    networks:
      - weabot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  weabot-net:
    name: weabot-net
    driver: bridge
