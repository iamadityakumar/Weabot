# Out-of-Scope Intent Definitions and Policies
# Defines explicit non-weather and unhandled operational boundaries

financial_investments:
  id: OOS-001
  title: Out of Scope · Non-Weather Query
  status: OUT_OF_SCOPE
  keywords:
    - tesla
    - stock
    - shares
    - crypto
    - bitcoin
    - invest in
    - buy stock
    - equity
    - portfolio
  refusal_message: >
    I am Weabot, an outdoor activity safety advisor. I provide safety guidance grounded in verified weather telemetry
    and approved standard operating procedures. Financial inquiries, stock purchase recommendations, and non-weather topics
    are outside my operational scope.

extreme_mountaineering:
  id: OOS-002
  title: Out of Scope · Extreme Mountaineering
  status: OUT_OF_SCOPE
  keywords:
    - everest
    - mount everest
    - k2
    - annapurna
    - kangchenjunga
    - lhotse
    - 8000m
    - death zone
  refusal_message: >
    Climbing Mount Everest or extreme high-altitude 8,000-meter peaks involves specialized alpine expedition logistics,
    death-zone hypoxia management, crevasse route safety, and localized high-camp weather modeling that is outside Weabot's
    operational scope. Please consult certified mountain guide federations (such as IFMGA/UIAGM) and dedicated Himalayan expedition forecasts.

national_early_warnings:
  id: OOS-003
  title: IMD Early Warning Not Monitored
  status: OUT_OF_SCOPE
  keywords:
    - has the imd issued
    - imd warning
    - imd alert
    - government weather warning
    - disaster management alert
  refusal_message: >
    ⚠️ **Data Source Notice: No IMD Early-Warning Integration**

    Weabot is powered by physical numerical telemetry from Open-Meteo and does not have an active data integration with the India Meteorological Department (IMD) or national synoptic early-warning feeds. Because we cannot monitor or verify official government alerts, please consult the official IMD portal (mausam.imd.gov.in) or local disaster management authorities for statutory warning advisories.

synoptic_meteorology:
  id: OOS-004
  title: Synoptic Tracking Not Monitored
  status: OUT_OF_SCOPE
  keywords:
    - low-pressure system
    - low pressure system
    - monsoon depression
    - western disturbance
    - synoptic system
  refusal_message: >
    ⚠️ **Data Source Notice: Synoptic Scale Tracking Not Monitored**

    Our service evaluates local numerical weather model telemetry (temperature, wind, precipitation, UV) for specific cities and coordinates. It does not monitor or track broad synoptic-scale weather systems (such as monsoon depressions, low-pressure areas, or western disturbances), which require synoptic satellite/radar tracking from regional meteorological agencies like the IMD.

prompt_disclosure:
  id: OOS-005
  title: Security Policy · Prompt Disclosure Refused
  status: REFUSED
  keywords:
    - print your system prompt
    - show your prompt
    - leak prompt
    - repeat instructions
    - dump system prompt
    - what is your system prompt
    - print every sop
    - dump sops
  refusal_message: >
    ⚠️ **Security Notice: System Configuration Disclosure Refused**

    To protect operational safety and policy integrity, our service does not disclose internal system prompts, raw instruction sets, or programmatic backend parameters. I remain fully available to answer verified outdoor safety inquiries against approved Standard Operating Procedures.
